name: Activation canary

# Full account/data-writing journey stays in disposable local PostgreSQL.
# Public production entry checks never submit forms or create accounts.
on:
  schedule:
    - cron: '15 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: activation-canary
  cancel-in-progress: false
jobs:
  canary:
    runs-on: [self-hosted, linux, ARM64, jms-ci]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qualcanvas
          POSTGRES_PASSWORD: qualcanvas
          POSTGRES_DB: qualcanvas_fullstack
        ports: ['5432/tcp']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      QC_FS_DATABASE_URL: postgresql://qualcanvas:qualcanvas@127.0.0.1:${{ job.services.postgres.ports[5432] }}/qualcanvas_fullstack?schema=public
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema=apps/backend/prisma/schema.prisma
      - run: npx playwright install --with-deps chromium
      - name: Local first coded excerpt at desktop and phone widths
        run: npx playwright test -c playwright.new-customer.config.ts
      - name: Public read-only browser entry
        if: always()
        run: |
          npm ci --prefix tests/new-customer --ignore-scripts
          export E2E_CHROMIUM=$(node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())")
          node tests/new-customer/entry-check.mjs activation-report/public
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activation-report-${{ github.run_id }}
          path: |
            activation-report
            test-results
          retention-days: 30
      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const title = '[new-customer] QualCanvas weekly activation check failed';
            const body = `Local activation or read-only public entry failed. Inspect the run and evidence: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nNo account-writing journey is run against production.`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {...context.repo, state:'open', per_page:100});
            const existing = issues.find(i => !i.pull_request && i.title === title);
            if (existing) await github.rest.issues.update({...context.repo, issue_number:existing.number, body});
            else await github.rest.issues.create({...context.repo, title, body});
