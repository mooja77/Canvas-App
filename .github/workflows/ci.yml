name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    # @prisma/config currently pins deepmerge-ts 7.1.5, which is affected by
    # GHSA-ggr8-5vv4-36mx. package.json overrides it to the compatible patched
    # major. Remove the override once Prisma ships @prisma/config with
    # deepmerge-ts >=8, but keep this audit as a permanent release gate.
    name: Dependency Audit
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://audit:audit@localhost:5432/audit?schema=public
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Reject high-severity production dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Verify Prisma configuration still loads with the patched merger
        run: npx prisma validate --schema=apps/backend/prisma/schema.prisma

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema=apps/backend/prisma/schema.prisma
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema=apps/backend/prisma/schema.prisma
      - run: npm run build
      - run: npm run build:budget

  deploy-image:
    # Builds the SAME Dockerfile Railway builds, and nothing else.
    #
    # Every backend deploy failed from 2026-08-22 to 2026-08-25 while CI stayed
    # green, and six merges shipped nothing to the API. `npm run build` passes at
    # the repo root, where every workspace is present; the image copies only
    # shared/ and apps/frontend/ into its frontend stage, so a frontend file
    # importing from apps/backend compiles here and fails there. Nothing in CI
    # ever built the image, so the difference stayed invisible until someone
    # asked why a merged fix was not live in production.
    #
    # That is what this job is for: it fails on the PR, before the merge that
    # would otherwise stop deploying without telling anyone.
    name: Deploy Image Builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [typecheck, lint, format]
    env:
      JWT_SECRET: test-secret-for-ci-pipeline-only
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=public
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema=apps/backend/prisma/schema.prisma
      - run: npm test

  schema-drift:
    # Replays the complete migration history on clean PostgreSQL and compares
    # the result with schema.prisma. This is a required release gate.
    name: Schema Drift Check
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://qualcanvas:qualcanvas@localhost:55432/qualcanvas_drift?schema=public
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qualcanvas
          POSTGRES_PASSWORD: qualcanvas
          POSTGRES_DB: qualcanvas_drift
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U qualcanvas -d qualcanvas_drift"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema=apps/backend/prisma/schema.prisma
      - name: Apply migration history to clean Postgres
        run: npx prisma migrate deploy --schema=apps/backend/prisma/schema.prisma
      - name: Diff deployed DB vs schema.prisma (fails on drift)
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel apps/backend/prisma/schema.prisma \
            --exit-code

  e2e-chromium:
    name: E2E Chromium
    runs-on: ubuntu-latest
    needs: [build, unit-tests]
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://qualcanvas:qualcanvas@localhost:55432/qualcanvas_e2e?schema=public
      JWT_SECRET: test-secret-for-ci-pipeline-only
      E2E_TEST: true
      # Ephemeral CI-only credential. Production demo access is never seeded
      # from source-controlled values.
      DEMO_ACCESS_CODE: e2e-only-qualcanvas-code-2026
      E2E_ACCESS_CODE: e2e-only-qualcanvas-code-2026
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qualcanvas
          POSTGRES_PASSWORD: qualcanvas
          POSTGRES_DB: qualcanvas_e2e
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U qualcanvas -d qualcanvas_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx prisma generate --schema=apps/backend/prisma/schema.prisma
      - run: npx prisma migrate deploy --schema=apps/backend/prisma/schema.prisma
      - run: npm run db:seed -w apps/backend
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  e2e-cross-browser:
    name: E2E Cross-browser Critical Paths
    runs-on: ubuntu-latest
    needs: [build, unit-tests]
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://qualcanvas:qualcanvas@localhost:55432/qualcanvas_e2e?schema=public
      JWT_SECRET: test-secret-for-ci-pipeline-only
      E2E_TEST: true
      DEMO_ACCESS_CODE: e2e-only-qualcanvas-code-2026
      E2E_ACCESS_CODE: e2e-only-qualcanvas-code-2026
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qualcanvas
          POSTGRES_PASSWORD: qualcanvas
          POSTGRES_DB: qualcanvas_e2e
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U qualcanvas -d qualcanvas_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx prisma generate --schema=apps/backend/prisma/schema.prisma
      - run: npx prisma migrate deploy --schema=apps/backend/prisma/schema.prisma
      - run: npm run db:seed -w apps/backend
      - name: Run critical journeys in desktop and mobile engines
        run: >-
          npx playwright test
          e2e/auth-flows.spec.ts
          e2e/canvas-full-workflow.spec.ts
          e2e/network-resilience.spec.ts
          e2e/mobile-responsive.spec.ts
          e2e/pages.spec.ts
          e2e/scenario-k-training.spec.ts
          --project=firefox --project=webkit
          --project=mobile-chrome --project=mobile-safari
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-cross-browser-report
          path: |
            playwright-report/
            test-results/
