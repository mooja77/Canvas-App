<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#0b1530" />
    <title>Page Not Found — QualCanvas</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        color: #0b1530;
        background: #f4f6f8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(100%, 620px);
        text-align: center;
      }
      .mark {
        display: inline-grid;
        place-items: center;
        width: 56px;
        height: 56px;
        margin-bottom: 28px;
        border-radius: 14px;
        background: #4f46e5;
        color: #fff;
        font:
          700 30px/1 Georgia,
          serif;
        box-shadow: 0 12px 30px rgb(79 70 229 / 20%);
      }
      .eyebrow {
        margin: 0 0 12px;
        color: #9a6815;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font:
          600 clamp(38px, 8vw, 62px)/1.05 Georgia,
          serif;
        letter-spacing: -0.02em;
      }
      p {
        max-width: 500px;
        margin: 20px auto 32px;
        color: #526078;
        font-size: 18px;
        line-height: 1.65;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }
      a {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 11px 20px;
        border-radius: 8px;
        font-weight: 650;
        text-decoration: none;
      }
      .primary {
        background: #0b1530;
        color: #fff;
      }
      .secondary {
        border: 1px solid #cbd3df;
        color: #0b1530;
        background: #fff;
      }
      a:focus-visible {
        outline: 3px solid #d8a635;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">Q</div>
      <p class="eyebrow">Error 404</p>
      <h1>This page has moved—or never existed.</h1>
      <p>
        The address may be mistyped. Return to QualCanvas, or open the training centre to find the workflow you need.
      </p>
      <nav aria-label="Useful destinations">
        <a class="primary" href="/">Return home</a>
        <a class="secondary" href="/training/">Open training</a>
      </nav>
    </main>
  </body>
</html>
